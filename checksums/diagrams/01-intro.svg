<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>
  
  <rect x="50" y="90" width="80" height="50" rx="8" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="90" y="120" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Server</text>

  <rect x="510" y="90" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="550" y="120" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Client</text>

  <!-- Connection -->
  <path d="M140,115 L500,115" fill="none" stroke="#0E6E5C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#green-arrow)"/>
  
  <!-- Disruption/File -->
  <rect x="270" y="90" width="100" height="50" rx="8" fill="#EEF5F2" stroke="#D32F2F" filter="url(#soft-shadow)"/>
  <text x="320" y="115" text-anchor="middle" fill="#D32F2F" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Corrupted File</text>
  <text x="320" y="132" text-anchor="middle" fill="#D32F2F" font-family="Space Grotesk, sans-serif" font-size="11">Data altered in transit</text>
  
  <!-- "100% Downloaded" Text -->
  <text x="550" y="160" text-anchor="middle" fill="#4B5058" font-family="Space Grotesk, sans-serif" font-size="12">100% Downloaded</text>
  <text x="550" y="175" text-anchor="middle" fill="#D32F2F" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">Won't Open</text>
</svg>
