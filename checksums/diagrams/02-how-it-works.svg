<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>

  <rect x="50" y="90" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="110" y="120" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Data (File)</text>
  <text x="110" y="155" text-anchor="middle" fill="#4B5058" font-family="Space Grotesk, sans-serif" font-size="11">e.g. Gigabytes</text>

  <rect x="250" y="80" width="140" height="70" rx="35" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="320" y="115" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Formula</text>
  <text x="320" y="132" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">(Hash Function)</text>

  <rect x="470" y="90" width="120" height="50" rx="8" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="530" y="120" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Checksum</text>
  <text x="530" y="155" text-anchor="middle" fill="#4B5058" font-family="Space Grotesk, sans-serif" font-size="11">Tiny, e.g. A3F1</text>

  <path d="M180,115 L240,115" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M400,115 L460,115" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#green-arrow)"/>
</svg>
