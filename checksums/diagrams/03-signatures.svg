<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>

  <!-- Sender side -->
  <text x="140" y="50" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">Software Company</text>
  
  <rect x="80" y="70" width="120" height="50" rx="8" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="140" y="100" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Private Key</text>

  <path d="M140,125 L140,155" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="60" y="165" width="160" height="60" rx="8" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="140" y="195" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Signed Update</text>
  <text x="140" y="215" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">(Cannot be forged)</text>

  <!-- Receiver side -->
  <text x="500" y="50" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">Your Computer</text>

  <rect x="440" y="70" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="500" y="100" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Public Key</text>

  <path d="M230,195 L495,195 L495,130" fill="none" stroke="#0E6E5C" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#green-arrow)"/>
  
  <text x="360" y="185" text-anchor="middle" fill="#4B5058" font-family="Space Grotesk, sans-serif" font-size="12">Downloads &amp; Verifies</text>
</svg>
