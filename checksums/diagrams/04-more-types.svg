<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>

  <text x="320" y="40" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">HMAC (Shared Secret)</text>

  <rect x="80" y="70" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="150" y="100" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Service A</text>
  
  <rect x="100" y="120" width="100" height="35" rx="5" fill="#2B2E36"/>
  <text x="150" y="142" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="12">Secret Key</text>

  <rect x="420" y="70" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="490" y="100" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Service B</text>

  <rect x="440" y="120" width="100" height="35" rx="5" fill="#2B2E36"/>
  <text x="490" y="142" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="12">Secret Key</text>

  <path d="M230,120 L410,120" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="320" y="105" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">Message + HMAC</text>
</svg>
