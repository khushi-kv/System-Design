<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="grey-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4B5058"/>
    </marker>
  </defs>

  <rect x="220" y="20" width="200" height="40" rx="8" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="320" y="45" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">What failure to catch?</text>

  <path d="M320,65 L320,100" fill="none" stroke="#4B5058" stroke-width="2"/>
  <path d="M100,100 L540,100" fill="none" stroke="#4B5058" stroke-width="2"/>

  <!-- Branches -->
  <path d="M100,100 L100,130" fill="none" stroke="#4B5058" stroke-width="2" marker-end="url(#grey-arrow)"/>
  <path d="M246,100 L246,130" fill="none" stroke="#4B5058" stroke-width="2" marker-end="url(#grey-arrow)"/>
  <path d="M393,100 L393,130" fill="none" stroke="#4B5058" stroke-width="2" marker-end="url(#grey-arrow)"/>
  <path d="M540,100 L540,130" fill="none" stroke="#4B5058" stroke-width="2" marker-end="url(#grey-arrow)"/>

  <!-- Column 1 -->
  <rect x="40" y="140" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="100" y="169" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">Accidents / Noise</text>
  
  <rect x="60" y="205" width="80" height="40" rx="6" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="100" y="230" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">CRC</text>

  <!-- Column 2 -->
  <rect x="186" y="140" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="246" y="169" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">File Fingerprint</text>

  <rect x="206" y="205" width="80" height="40" rx="6" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="246" y="230" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">SHA-256</text>

  <!-- Column 3 -->
  <rect x="333" y="140" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="393" y="169" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">Shared Secret</text>

  <rect x="353" y="205" width="80" height="40" rx="6" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="393" y="230" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">HMAC</text>

  <!-- Column 4 -->
  <rect x="480" y="140" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="540" y="169" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">Anyone Verify</text>

  <rect x="500" y="205" width="80" height="40" rx="6" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="540" y="230" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Signature</text>

</svg>
