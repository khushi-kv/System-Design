<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="rr-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>
  
  <rect x="50" y="90" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="90" y="120" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Client</text>

  <rect x="250" y="60" width="140" height="110" rx="8" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="320" y="85" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Internet</text>
  
  <text x="320" y="110" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">1. DNS</text>
  <text x="320" y="130" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">2. TCP/IP</text>
  <text x="320" y="150" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">3. Port (HTTP)</text>

  <rect x="510" y="90" width="80" height="50" rx="8" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="550" y="120" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">Server</text>

  <path d="M130,105 L245,105" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
  <text x="190" y="95" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">Request</text>
  
  <path d="M245,125 L135,125" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
  <text x="190" y="140" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">Response</text>

  <path d="M390,105 L505,105" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
  <text x="450" y="95" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">Forward</text>
  
  <path d="M505,125 L395,125" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
</svg>
