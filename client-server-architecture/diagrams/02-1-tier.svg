<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect x="170" y="40" width="300" height="150" rx="12" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
  <text x="320" y="70" text-anchor="middle" fill="#0E6E5C" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">Single Machine (1-Tier)</text>

  <rect x="200" y="90" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="320" y="110" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">Presentation (Client UI)</text>

  <rect x="200" y="130" width="110" height="30" rx="4" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="255" y="150" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">App Logic</text>

  <rect x="330" y="130" width="110" height="30" rx="4" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="385" y="150" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">Database</text>
  
</svg>
