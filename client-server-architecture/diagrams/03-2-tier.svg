<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
    <marker id="rr-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/>
    </marker>
  </defs>

  <rect x="80" y="50" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
  <text x="170" y="80" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">Client</text>
  <rect x="100" y="100" width="140" height="30" rx="4" fill="#EEF5F2" stroke="#0E6E5C"/>
  <text x="170" y="120" text-anchor="middle" fill="#1C1F26" font-family="Space Grotesk, sans-serif" font-size="12">UI &amp; Processing</text>

  <rect x="380" y="50" width="180" height="130" rx="12" fill="#2B2E36" filter="url(#soft-shadow)"/>
  <text x="470" y="80" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600">Server</text>
  <rect x="400" y="100" width="140" height="30" rx="4" fill="#4B5058"/>
  <text x="470" y="120" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="12">Database / Logic</text>

  <path d="M260,105 L375,105" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
  <text x="320" y="95" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">Network Request</text>
  
  <path d="M375,125 L265,125" fill="none" stroke="#0E6E5C" stroke-width="2" marker-end="url(#rr-arrow)"/>
</svg>
