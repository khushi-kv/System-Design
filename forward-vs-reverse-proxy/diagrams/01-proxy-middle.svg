<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff" />
  
  <!-- Client -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#4a90e2" />
    <rect x="10" y="10" width="60" height="40" fill="#ffffff" opacity="0.3" />
    <rect x="-10" y="60" width="100" height="10" rx="3" fill="#3a7bc8" />
    <text x="40" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Client</text>
  </g>
  
  <!-- Proxy -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="80" height="90" rx="5" fill="#f5a623" />
    <line x1="20" y1="20" x2="60" y2="20" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="40" x2="60" y2="40" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="60" x2="60" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <text x="40" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Proxy</text>
  </g>
  
  <!-- Application Server -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="80" height="90" rx="5" fill="#2ecc71" />
    <circle cx="40" cy="45" r="15" fill="#fff" opacity="0.5" />
    <text x="40" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Server</text>
  </g>
  
  <!-- Arrows -->
  <line x1="210" y1="125" x2="340" y2="125" stroke="#7f8c8d" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="460" y1="125" x2="590" y2="125" stroke="#7f8c8d" stroke-width="4" marker-end="url(#arrow)" />
  
  <!-- Labels -->
  <text x="275" y="110" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Request</text>
  <text x="525" y="110" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Forwarded</text>
</svg>
