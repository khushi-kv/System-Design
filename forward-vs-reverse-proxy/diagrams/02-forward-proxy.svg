<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" />
  
  <!-- Client Zone -->
  <rect x="40" y="40" width="220" height="320" rx="10" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" />
  <text x="150" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Inside Network</text>
  
  <!-- Client Node -->
  <g transform="translate(110, 150)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1976d2" />
    <rect x="10" y="10" width="60" height="40" fill="#ffffff" opacity="0.4" />
    <text x="40" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Client</text>
    <text x="40" y="110" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">IP: 192.168.1.5</text>
  </g>
  
  <!-- Forward Proxy -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="80" height="120" rx="10" fill="#f39c12" />
    <circle cx="40" cy="40" r="15" fill="#fff" opacity="0.3" />
    <text x="40" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Forward Proxy</text>
    <text x="40" y="170" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">IP: 203.0.113.1</text>
  </g>
  
  <!-- Internet Zone -->
  <rect x="540" y="40" width="220" height="320" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" />
  <text x="650" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Internet</text>
  
  <!-- Public Website -->
  <g transform="translate(610, 150)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#2ecc71" />
    <text x="40" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Website</text>
    <text x="40" y="130" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">Sees IP: 203.0.113.1</text>
  </g>
  
  <!-- Flow lines with labels -->
  <!-- Step 1 -->
  <path d="M 210 160 L 340 160" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="275" y="150" font-family="sans-serif" font-size="12" fill="#34495e" text-anchor="middle">1. Request site</text>
  
  <!-- Step 2 -->
  <path d="M 460 160 L 590 160" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="525" y="150" font-family="sans-serif" font-size="12" fill="#34495e" text-anchor="middle">2. Proxy fetches site</text>
  
  <!-- Step 3 -->
  <path d="M 590 200 L 460 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="525" y="215" font-family="sans-serif" font-size="12" fill="#34495e" text-anchor="middle">3. Site replies to Proxy</text>
  
  <!-- Step 4 -->
  <path d="M 340 200 L 210 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="275" y="215" font-family="sans-serif" font-size="12" fill="#34495e" text-anchor="middle">4. Proxy replies to Client</text>
</svg>
