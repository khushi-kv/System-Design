<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />
  
  <!-- Internet -->
  <g transform="translate(50, 120)">
    <path d="M 30 60 Q 30 20 70 20 Q 90 0 120 20 Q 160 20 160 60 Q 190 70 170 110 Q 150 140 100 130 Q 50 140 20 100 Q 0 70 30 60 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" />
    <text x="100" y="85" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7f8c8d" text-anchor="middle">Internet</text>
  </g>
  
  <!-- Failed Reverse Proxy -->
  <g transform="translate(320, 150)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#95a5a6" />
    <text x="40" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e74c3c" text-anchor="middle">Reverse Proxy</text>
    <text x="40" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e74c3c" text-anchor="middle">(DOWN)</text>
    <!-- Cross mark -->
    <line x1="20" y1="30" x2="60" y2="70" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" />
    <line x1="60" y1="30" x2="20" y2="70" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <!-- Internal Network Box -->
  <rect x="520" y="50" width="220" height="300" rx="10" fill="#e8f5e9" stroke="#2ecc71" stroke-width="2" />
  <text x="630" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">Backend Servers</text>
  <text x="630" y="100" font-family="sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">(Healthy but unreachable)</text>
  
  <!-- Servers -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#2ecc71" />
    <rect x="0" y="70" width="60" height="40" rx="5" fill="#2ecc71" />
    <rect x="0" y="140" width="60" height="40" rx="5" fill="#2ecc71" />
  </g>
  
  <!-- Incoming Arrow (Failing) -->
  <line x1="210" y1="200" x2="290" y2="200" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrow-red)" />
  
  <!-- Outgoing Arrows (Broken) -->
  <line x1="420" y1="180" x2="580" y2="140" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="10, 5" />
  <line x1="420" y1="200" x2="580" y2="200" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="10, 5" />
  <line x1="420" y1="220" x2="580" y2="260" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="10, 5" />
  
  <text x="480" y="160" font-family="sans-serif" font-size="24" fill="#e74c3c" font-weight="bold">X</text>
</svg>
