          <rect x="420" y="130" width="180" height="46" rx="8" fill="#E4F1EC" stroke="#0E6E5C" stroke-width="2" filter="url(#soft-shadow)"/>
          <text x="436" y="152" fill="#1C1F26" font-weight="600">Server 61 — load 22%</text>
        </g>
        <path d="M240,72 Q330,90 420,110" fill="none" stroke="#DAD6CC" stroke-width="1.5"/>
        <path d="M240,152 L420,152" fill="none" stroke="#0E6E5C" stroke-width="2.5" marker-end="url(#p2-arrow)"/>
        <text x="330" y="200" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" fill="#0E6E5C" font-weight="600">compare the two → send to the less loaded one</text>
