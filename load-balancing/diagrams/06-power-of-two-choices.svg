<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>

          <marker id="p2-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/></marker>
        </defs>
        <rect x="20" y="95" width="70" height="38" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
        <text x="55" y="118" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12">LB</text>

        <g font-family="Space Grotesk, sans-serif" font-size="11">
          <rect x="150" y="15" width="90" height="34" rx="7" fill="#EEF5F2" stroke="#DAD6CC" filter="url(#soft-shadow)"/><text x="195" y="36" text-anchor="middle" fill="#4B5058">Server 12</text>
          <rect x="150" y="55" width="90" height="34" rx="7" fill="#F6EBDC" stroke="#B5732A" stroke-width="2" filter="url(#soft-shadow)"/><text x="195" y="76" text-anchor="middle" fill="#1C1F26" font-weight="600">Server 27 ★</text>
          <rect x="150" y="95" width="90" height="34" rx="7" fill="#EEF5F2" stroke="#DAD6CC" filter="url(#soft-shadow)"/><text x="195" y="116" text-anchor="middle" fill="#4B5058">Server 44</text>
          <rect x="150" y="135" width="90" height="34" rx="7" fill="#E4F1EC" stroke="#0E6E5C" stroke-width="2" filter="url(#soft-shadow)"/><text x="195" y="156" text-anchor="middle" fill="#1C1F26" font-weight="600">Server 61 ★</text>
          <rect x="150" y="175" width="90" height="34" rx="7" fill="#EEF5F2" stroke="#DAD6CC" filter="url(#soft-shadow)"/><text x="195" y="196" text-anchor="middle" fill="#4B5058">Server 88</text>
        </g>
        <text x="195" y="8" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="10.5" fill="#4B5058">pool of 500 servers (5 shown)</text>

        <path d="M90,110 Q120,72 150,72" fill="none" stroke="#B5732A" stroke-width="2" stroke-dasharray="3 3"/>
        <path d="M90,116 Q120,152 150,152" fill="none" stroke="#0E6E5C" stroke-width="2" stroke-dasharray="3 3"/>
        <text x="115" y="60" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="10" fill="#4B5058">pick 2 random</text>

        <g font-family="Space Grotesk, sans-serif" font-size="12">
          <rect x="420" y="50" width="180" height="46" rx="8" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/>
