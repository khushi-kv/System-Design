<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>

          <marker id="ip-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0E6E5C"/></marker>
        </defs>
        <circle cx="55" cy="95" r="28" fill="#2B2E36" filter="url(#soft-shadow)"/>
        <text x="55" y="99" text-anchor="middle" fill="#FAF9F6" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="600">client</text>
        <text x="55" y="140" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">203.0.113.9</text>

        <rect x="140" y="65" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#4B5058" filter="url(#soft-shadow)"/>
        <text x="195" y="90" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11">hash(IP)</text>
        <text x="195" y="110" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">mod N servers</text>

        <g font-family="Space Grotesk, sans-serif" font-size="12">
          <rect x="400" y="20" width="150" height="38" rx="8" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/><text x="475" y="43" text-anchor="middle">Server A</text>
          <rect x="400" y="76" width="150" height="38" rx="8" fill="#E4F1EC" stroke="#0E6E5C" stroke-width="2" filter="url(#soft-shadow)"/><text x="475" y="99" text-anchor="middle" font-weight="600">Server B</text>
          <rect x="400" y="132" width="150" height="38" rx="8" fill="#EEF5F2" stroke="#0E6E5C" filter="url(#soft-shadow)"/><text x="475" y="155" text-anchor="middle">Server C</text>
        </g>
        <path d="M250,95 L400,95" fill="none" stroke="#0E6E5C" stroke-width="2.5" marker-end="url(#ip-arrow)"/>
        <text x="325" y="175" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">this client always lands on B, as long as the server count stays fixed</text>
      </svg>