<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1F26" flood-opacity="0.12"/>
    </filter>
  </defs>
        <circle cx="240" cy="210" r="150" fill="none" stroke="#DAD6CC" stroke-width="2"/>

        <!-- servers on ring -->
        <g font-family="Space Grotesk, sans-serif" font-size="12">
          <circle cx="240" cy="60" r="9" fill="#EEF5F2" stroke="#0E6E5C" stroke-width="2.5" filter="url(#soft-shadow)"/>
          <text x="240" y="42" text-anchor="middle" font-weight="600">Server A</text>

          <circle cx="382" cy="210" r="9" fill="#EEF5F2" stroke="#0E6E5C" stroke-width="2.5" filter="url(#soft-shadow)"/>
          <text x="405" y="210" text-anchor="start" font-weight="600">Server B</text>

          <circle cx="240" cy="360" r="9" fill="#EEF5F2" stroke="#0E6E5C" stroke-width="2.5" filter="url(#soft-shadow)"/>
          <text x="240" y="382" text-anchor="middle" font-weight="600">Server C</text>

          <circle cx="98" cy="210" r="9" fill="#EEF5F2" stroke="#0E6E5C" stroke-width="2.5" filter="url(#soft-shadow)"/>
          <text x="75" y="210" text-anchor="end" font-weight="600">Server D</text>
        </g>

        <!-- keys -->
        <g font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">
          <circle cx="150" cy="90" r="5" fill="#B5732A"/>
          <text x="130" y="80" text-anchor="end">key: user_412</text>
          <path d="M154,88 Q195,72 232,62" fill="none" stroke="#B5732A" stroke-width="1.5" stroke-dasharray="3 2"/>

          <circle cx="330" cy="120" r="5" fill="#B5732A"/>
          <text x="345" y="108">key: user_88</text>
          <path d="M333,124 Q365,165 378,202" fill="none" stroke="#B5732A" stroke-width="1.5" stroke-dasharray="3 2"/>

          <circle cx="330" cy="300" r="5" fill="#B5732A"/>
          <text x="345" y="316">key: user_205</text>
          <path d="M330,296 Q300,335 248,357" fill="none" stroke="#B5732A" stroke-width="1.5" stroke-dasharray="3 2"/>
        </g>

        <text x="240" y="212" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">each key belongs to the</text>
        <text x="240" y="226" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5058">next server clockwise</text>
      </svg>